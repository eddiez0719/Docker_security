name: security-pipeline

# CONSUMING workflow — triggers only. The entire gate (hadolint -> Bandit ->
# Trivy -> SonarQube) lives in eddiez0719/shared-workflows and this repo is
# happy with its defaults, so there is nothing to configure here.
on:
  push:
    # "**" matches every branch, including ones with a slash such as
    # feature/foo. A single "*" would NOT match those.
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  security:
    uses: eddiez0719/shared-workflows/.github/workflows/security-scan.yml@main
    secrets: inherit
