# ============================================================
# THIS FILE LIVES IN THE APP REPO. It starts the security checks.
# 这个文件放在应用仓库里。它负责启动安全检查。
#
# It does not contain any checks itself. All the checks are
# 它本身不包含任何检查逻辑。所有检查都写在
# written in another repo (shared-workflows). This file just
# 另一个仓库里（shared-workflows）。这个文件只是
# says: "run those checks on my code."
# 说一句：“用那些检查来查我的代码。”
# ============================================================

# The name you will see in the "Actions" tab on GitHub.
# 这是你在 GitHub 的 "Actions" 标签页里看到的名字。
name: security-pipeline

# "on" means: when should this run?
# "on" 的意思是：什么时候运行？
on:
  # Run it when someone pushes code.
  # 有人 push 代码时运行。
  push:
    # Which branches. "**" means all branches.
    # 哪些分支。"**" 表示所有分支。
    # Careful: one star "*" would miss names with a slash,
    # 注意：一个星号 "*" 会漏掉带斜杠的名字，
    # like feature/login. Two stars catch those too.
    # 比如 feature/login。两个星号才能匹配到它们。
    branches: ["**"]
  # Also run it when someone opens a pull request...
  # 有人开 pull request 时也运行……
  pull_request:
    # ...but only a pull request that wants to go into main.
    # ……但只限于目标分支是 main 的 pull request。
    branches: ["main"]

# "jobs" is the list of work to do. Here there is only one.
# "jobs" 是要做的工作清单。这里只有一个。
jobs:
  # "security" is just a name we picked for this job.
  # "security" 只是我们给这个 job 起的名字。
  security:
    # Normally a job has "steps". This one does not.
    # 一般 job 里会写 "steps"。这个没有。
    # "uses" here means: run a whole workflow from another repo.
    # 这里的 "uses" 意思是：运行另一个仓库里的整个 workflow。
    # The address is: owner / repo / path to the file @ branch
    # 地址格式是：账号 / 仓库 / 文件路径 @ 分支
    uses: eddiez0719/shared-workflows/.github/workflows/security-scan.yml@main
    # The other repo cannot see our passwords unless we send them.
    # 另一个仓库看不到我们的密码，除非我们主动传过去。
    # "inherit" sends all of them in one line, so we do not have
    # "inherit" 一行就把所有密码都传过去，这样就不用
    # to list each password by name.
    # 一个一个地把密码名字列出来。
    secrets: inherit
    # There is no "with" here on purpose.
    # 这里故意不写 "with"。
    # The shared file already has good default settings that fit
    # 共享文件里的默认设置已经很适合这个项目，
    # this project, so we do not need to change anything.
    # 所以我们不需要改任何东西。
